services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: apofocus
      POSTGRES_USER: apofocus
      POSTGRES_PASSWORD: apofocus
    ports:
      - "5432:5432"
    volumes:
      - apofocus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apofocus -d apofocus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  apofocus-postgres:
